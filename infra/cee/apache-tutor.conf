# Tutor Virtual CEE (Grupo 5) dentro del campus Moodle (Grupo 3): https://<campus>/tutor/ -> Nginx del tutor.
# El tutor corre en la misma PC (WSL2) y escucha en 127.0.0.1:8090 (PUERTO_WEB del .env del tutor).
#
# Instalación (la hace quien administra el Apache del campus):
#   1. Copiar este archivo a C:\CEE-Campus\apps\Apache24\conf\extra\tutor-cee.conf
#   2. En la plantilla de httpd.conf de scripts\servidor\instalar-servidor.ps1, antes de los <VirtualHost>, agregar:
#        IncludeOptional conf/extra/tutor-cee.conf
#      (IncludeOptional: si el archivo no está, Apache arranca igual.)
#   3. Volver a correr instalar-servidor.ps1 (o editar httpd.conf a mano) y Restart-Service cee-apache.
#   4. Moodle > Administración del sitio > Apariencia > HTML adicional > "Antes de cerrar BODY":
#        <script src="/tutor/widget/tutor-cee.js" data-api="/tutor/api" defer></script>
#      Las rutas son relativas: sirven igual con la IP, con el dominio de OTI, con http o con https.

<IfModule !proxy_module>
    LoadModule proxy_module modules/mod_proxy.so
</IfModule>
<IfModule !proxy_http_module>
    LoadModule proxy_http_module modules/mod_proxy_http.so
</IfModule>

# Solo /tutor/ va al tutor; todo lo demás sigue siendo Moodle. mod_proxy agrega X-Forwarded-For con la IP
# de cada alumno, y la API la usa para el límite de preguntas por minuto.
ProxyPass        /tutor/ http://127.0.0.1:8090/ connectiontimeout=5 timeout=180
ProxyPassReverse /tutor/ http://127.0.0.1:8090/
