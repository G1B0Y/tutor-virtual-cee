# Nginx del tutor en la PC del CEE (servicio "web" de docker-compose.cee.yml).
#   /                       chat dentro del campus simulado (piloto sin Moodle)
#   /widget/tutor-cee.js    el chat en un solo archivo, para el "HTML adicional" de Moodle
#   /api/...                la API (FastAPI); /api/salud dice si todo responde
server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # Las preguntas son de máximo 500 caracteres: nada más grande tiene por qué llegar.
    client_max_body_size 16k;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /widget/tutor-cee.js {
        # Que Moodle tome la versión nueva poco después de actualizar.
        add_header Cache-Control "public, max-age=300";
        add_header X-Content-Type-Options nosniff always;
    }

    # La documentación de la API no se publica: se ve desde la propia PC en http://localhost:8000/docs.
    location ~ ^/api/(docs|redoc|openapi\.json) {
        return 404;
    }

    location /api/ {
        proxy_pass http://api:8000/;   # quita el /api del inicio
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # En CPU una respuesta puede tardar; la API corta antes por su cuenta.
        proxy_read_timeout 180s;
    }
}
